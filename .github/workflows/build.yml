name: Build and Package Pure HTML/TS App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./pure-html-ts
        run: npm ci

      - name: Build pure-html-ts app
        working-directory: ./pure-html-ts
        run: npm run build

      - name: Upload compiled distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pure-html-ts-app
          path: pure-html-ts/dist/
